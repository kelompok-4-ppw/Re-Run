services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rerun_app
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - rerun_net
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: rerun_nginx
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - rerun_net
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: rerun_db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: rerun_db
      MYSQL_USER: rerun_user
      MYSQL_PASSWORD: rerun_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - rerun_net

  mailpit:
    image: axllent/mailpit
    container_name: rerun_mailpit
    ports:
      - "8025:8025" # Web UI untuk cek email reset password
      - "1025:1025" # SMTP Server
    networks:
      - rerun_net

networks:
  rerun_net:
    driver: bridge

volumes:
  dbdata: